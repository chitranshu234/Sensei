# Activate with: --spring.profiles.active=postgres
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sensei}
    driverClassName: org.postgresql.Driver
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # Replace with `validate` once you adopt Flyway/Liquibase migrations.
      ddl-auto: update
    show-sql: false

  h2:
    console:
      enabled: false

app:
  security:
    # The H2 console is meaningless on Postgres and must stay off.
    h2-console-enabled: false
